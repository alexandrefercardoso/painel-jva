name: Supabase Keep-alive

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping em todos os projetos Supabase
        env:
          SUPABASE_PROJECTS: ${{ secrets.SUPABASE_PROJECTS }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_PROJECTS:-}" ]]; then
            echo "::error::Secret SUPABASE_PROJECTS não configurado no repositório."
            exit 1
          fi

          failed=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="$(echo "$line" | tr -d '[:space:]')"
            [[ -z "$line" ]] && continue

            url="${line%%|*}"
            key="${line##*|}"

            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST "${url}/rest/v1/rpc/keep_alive" \
              -H "apikey: ${key}" \
              -H "Authorization: Bearer ${key}" \
              -H "Content-Type: application/json" \
              -d '{}')"

            echo "Keep-alive ${url} -> HTTP ${code}"

            if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error file=keep-alive.yml::Falha no projeto ${url} (HTTP ${code})."
              failed=1
            fi
          done <<< "$SUPABASE_PROJECTS"

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Um ou mais projetos retornaram status fora de 2xx."
            exit 1
          fi

          echo "Keep-alive concluído com sucesso para todos os projetos."