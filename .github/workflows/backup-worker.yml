# ============================================================================
# BACKUP WORKER — JVA Sistemas
#
# Executor dos backups reais (pg_dump / pg_restore). Verifica a fila de jobs
# pendentes no banco central a cada 5 minutos; roda manualmente pela aba
# Actions (workflow_dispatch) se necessário.
#
# SECRETS OBRIGATÓRIOS (GitHub > Settings > Secrets and variables > Actions):
#   SUPABASE_URL              — https://hepvdpktubhcklerdvqb.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — service_role do banco central (NUNCA a anon key;
#                               é secret do GitHub, não aparece em logs)
#   BACKUP_CRYPTO_KEY         — mesma chave do Vercel (decifra credenciais)
#
# Concorrência controlada: um único worker por vez.
# ============================================================================

name: Backup Worker

on:
  schedule:
    - cron: "*/5 * * * *" # verificação da fila (com FASE 6, atende agendamentos)
  workflow_dispatch:

concurrency:
  group: backup-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garantir PostgreSQL Client 17 (pg_dump/pg_restore)
        run: |
          set -euo pipefail
          # pg_dump/pg_restore NÃO podem ser mais antigos que o servidor (Supabase:
          # PG15/16/17). O ubuntu-latest vem com cliente 16 pré-instalado em /usr/bin —
          # daí instalamos o 17 explicitamente e antecipa o bindir do 17 no PATH.
          sudo apt-get update -qq
          if ! sudo apt-get install -y --no-install-recommends postgresql-client-17; then
            sudo apt-get install -y --no-install-recommends postgresql-common apt-transport-https
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client-17
          fi
          BIN17=/usr/lib/postgresql/17/bin
          sudo update-alternatives --set pg_dump "$BIN17/pg_dump" >/dev/null 2>&1 || true
          sudo update-alternatives --set pg_restore "$BIN17/pg_restore" >/dev/null 2>&1 || true
          if [ -d "$BIN17" ]; then
            echo "$BIN17" >> "$GITHUB_PATH"
          fi
          VDUMPP="$(command -v pg_dump)"; VRESTP="$(command -v pg_restore)"
          VDUMP="$(pg_dump --version)"; VREST="$(pg_restore --version)"
          echo "pg_dump: $VDUMP ($VDUMPP)"; echo "pg_restore: $VREST ($VRESTP)"
          case "$VDUMP;$VREST" in
            *17*|*18*|*19*) : ;;
            *)
              echo "::error::Cliente PostgreSQL < 17 no PATH — pg_dump:$VDUMP pg_restore:$VREST"
              exit 1
              ;;
          esac

      - name: Executar worker (fila de backups)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_CRYPTO_KEY: ${{ secrets.BACKUP_CRYPTO_KEY }}
        run: node worker/backup-worker.mjs
