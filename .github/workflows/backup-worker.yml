# ============================================================================
# BACKUP WORKER — JVA Sistemas
#
# Executor dos backups reais (pg_dump / pg_restore). Verifica a fila de jobs
# pendentes no banco central a cada 5 minutos; roda manualmente pela aba
# Actions (workflow_dispatch) se necessário.
#
# SECRETS OBRIGATÓRIOS (GitHub > Settings > Secrets and variables > Actions):
#   SUPABASE_URL              — https://hepvdpktubhcklerdvqb.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — service_role do banco central (NUNCA a anon key;
#                               é secret do GitHub, não aparece em logs)
#   BACKUP_CRYPTO_KEY         — mesma chave do Vercel (decifra credenciais)
#
# Concorrência controlada: um único worker por vez.
# ============================================================================

name: Backup Worker

on:
  schedule:
    - cron: "*/5 * * * *" # verificação da fila (com FASE 6, atende agendamentos)
  workflow_dispatch:

concurrency:
  group: backup-worker
  cancel-in-progress: false

jobs:
  worker:
    # Fixado no 24.04: o ubuntu-latest migrou p/ Ubuntu 26 (out/2026) e o passo
    # de cliente PostgreSQL ficou instável; 24.04 tem pgdg/cliente-17 garantidos.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garantir PostgreSQL Client 17 (pg_dump/pg_restore)
        run: |
          set -euo pipefail
          # pg_dump/pg_restore NÃO podem ser mais antigos que o servidor (Supabase:
          # PG15/16/17). Instalamos o cliente explicitamente e exportamos os caminhos
          # ABSOLUTOS (PG_DUMP_BIN/PG_RESTORE_BIN) para o worker — nada de depender
          # de PATH/pg_wrapper/alternatives do runner, que podem servir o 16 mesmo
          # com o pacote "instalado".
          sudo apt-get update -qq
          ACHOU=""
          for V in 17 18; do
            if sudo apt-get install -y --no-install-recommends postgresql-client-$V; then
              ACHOU=$V
              break
            fi
            echo "postgresql-client-$V indisponível — adicionando repositório pgdg…"
            sudo apt-get install -y --no-install-recommends postgresql-common apt-transport-https ca-certificates
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get update -qq
            if sudo apt-get install -y --no-install-recommends postgresql-client-$V; then
              ACHOU=$V
              break
            fi
          done
          if [ -z "$ACHOU" ]; then
            echo "Diagnóstico do apt:"
            lsb_release -ds || cat /etc/os-release | head -1
            apt-cache policy postgresql-client postgresql-client-17 || true
            echo "::error::Nenhum cliente PostgreSQL >= 17 disponível no runner."
            exit 1
          fi
          BINDIR=/usr/lib/postgresql/$ACHOU/bin
          if [ ! -x "$BINDIR/pg_dump" ]; then
            echo "Diagnóstico: ls /usr/lib/postgresql/"
            ls /usr/lib/postgresql/ || true
            echo "::error::Binário do cliente $ACHOU não encontrado em $BINDIR."
            exit 1
          fi
          VDUMP="$("$BINDIR/pg_dump" --version)"
          VREST="$("$BINDIR/pg_restore" --version)"
          echo "pg_dump:   $VDUMP"
          echo "pg_restore: $VREST"
          case "$VDUMP;$VREST" in
            *17*|*18*|*19*) : ;;
            *)
              echo "::error::Cliente PostgreSQL < 17 — pg_dump:$VDUMP pg_restore:$VREST"
              exit 1
              ;;
          esac
          echo "PG_DUMP_BIN=$BINDIR/pg_dump" >> "$GITHUB_ENV"
          echo "PG_RESTORE_BIN=$BINDIR/pg_restore" >> "$GITHUB_ENV"

      - name: Executar worker (fila de backups)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_CRYPTO_KEY: ${{ secrets.BACKUP_CRYPTO_KEY }}
        run: node worker/backup-worker.mjs
